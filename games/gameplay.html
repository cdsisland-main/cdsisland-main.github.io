<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gameplay</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="icon" type="image/x-icon" href="bench.ico">
  <script src="../assets/site.js" defer></script>
</head>
<body>
  <div class="site">
    <header class="masthead">
      <h1 data-game-title>gameplay</h1>
      
      <p>click the game window once if it needs your attention</p>
    </header>
    <nav class="nav" aria-label="main navigation"><a href="../index.html">home</a><a href="../projects/projects.html">projects</a><a href="games.html" aria-current="page">games</a><a href="../blogs/blog.html">blog</a></nav>
    <div class="layout game-layout">
      <main>
        <section class="panel game-panel">
          <h2 data-game-title>gameplay</h2>
          <div class="panel-body">
            <iframe class="game-frame" data-game-frame src="underconstruction.html" title="game window" allow="autoplay; fullscreen" allowfullscreen>
              <p>your browser does not support embedded games. <a href="underconstruction.html" data-game-fallback>open the game page</a>.</p>
            </iframe>
          </div>
        </section>
        <div class="game-actions">
          <button type="button" data-game-fullscreen hidden aria-pressed="false">fullscreen</button>
          <a href="games.html">&larr; back to games</a>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
